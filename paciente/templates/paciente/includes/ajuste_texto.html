<article class="card text-size-card" id="ajuste-texto">
    <h2>Tamaño del texto</h2>
    <p class="text-size-desc">
        Elija un tamaño cómodo para leer sus medicinas e instrucciones en toda la aplicación.
    </p>

    <div class="text-size-options" role="group" aria-label="Tamaño del texto">
        <button type="button" class="text-size-btn" data-text-size-option="normal" aria-pressed="false">
            Normal
        </button>
        <button type="button" class="text-size-btn" data-text-size-option="large" aria-pressed="false">
            Grande
        </button>
        <button type="button" class="text-size-btn" data-text-size-option="xlarge" aria-pressed="false">
            Muy grande
        </button>
    </div>

    <div class="text-size-preview" aria-hidden="true">
        <p class="text-size-preview-label">Vista previa</p>
        <p class="text-size-preview-name">Metformina</p>
        <p class="text-size-preview-dosis med-dosis">850 mg — Oral</p>
        <p class="text-size-preview-instrucciones med-instrucciones">Tomar con el desayuno y la cena.</p>
    </div>

    <p id="text-size-status" class="text-size-status" aria-live="polite"></p>
</article>
