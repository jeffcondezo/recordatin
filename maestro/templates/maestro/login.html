{% extends 'maestro/base.html' %}

{% block title %}Ingreso estudio — Recordatin{% endblock %}

{% block content %}
<section class="maestro-login-card card">
    <h1 class="page-title">Panel del estudio</h1>
    <p class="lead-text">Ingrese con la cuenta de administrador investigador.</p>
    <form method="post" class="login-form">
        {% csrf_token %}
        {% if form.non_field_errors %}
        <div class="alert alert-error">{{ form.non_field_errors }}</div>
        {% endif %}
        <label for="id_username">Usuario</label>
        <input type="text" name="username" id="id_username" required autofocus class="form-control"
               autocomplete="username" placeholder="admin.estudio">
        <label for="id_password">Contraseña</label>
        <input type="password" name="password" id="id_password" required class="form-control"
               autocomplete="current-password">
        <button type="submit" class="btn btn-primary btn-block">Entrar</button>
    </form>
</section>
{% endblock %}
